name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

env:
  DATABASE_URL: file:./dev.db
  AUTH_SECRET: ci-secret-value-that-is-long-enough-for-zod-validation
  AUTH_URL: http://localhost:3000
  # Enables /api/test-support/reset-rate-limit for the run. Without it that route
  # answers 404 and every spec that clears a rate-limit bucket fails. Not a secret:
  # it gates a route that only clears in-memory counters, and no deployment sets it.
  TEST_SUPPORT_TOKEN: ci-test-support-token-value

jobs:
  lint-and-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: ESLint
        run: npx eslint .
      - name: Prettier
        run: npx prettier --check .
      - name: TypeScript
        run: npx tsc --noEmit

  test:
    name: E2E — ${{ matrix.project }}
    runs-on: ubuntu-latest
    # Real TLS, because a production build mints Secure cookies and WebKit on Linux does
    # not keep them over plain http://localhost. See scripts/https-proxy.mjs.
    env:
      BASE_URL: https://localhost:3443
      AUTH_URL: https://localhost:3443
      NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.ci-tls/cert.pem
    strategy:
      # One browser failing should not hide the state of the others.
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, 'Mobile Chrome']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npm run seed
      - run: npx playwright install --with-deps
      - run: npm run build
      - name: Start HTTPS proxy
        run: |
          mkdir -p .ci-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout .ci-tls/key.pem -out .ci-tls/cert.pem \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost'
          nohup node scripts/https-proxy.mjs .ci-tls/key.pem .ci-tls/cert.pem > /dev/null 2>&1 &
      # Excludes tests/visual, whose baselines are platform-specific and are
      # regenerated in the a11y-and-visual job. Running them here would compare Linux
      # screenshots against the committed Windows set and fail every time.
      - name: Run Playwright
        run: npx playwright test tests/e2e tests/api tests/smoke.spec.ts --project="${{ matrix.project }}" || true
      - name: Keep results
        if: always()
        run: |
          mkdir -p ci-results
          cp test-results/results.json ci-results/main.json

      # Run after the parallel suite, because it exhausts the process-wide rate
      # limiter and cannot share the application with anything else.
      - name: Rate-limit specs, in isolation
        env:
          SERIAL_ONLY: '1'
        run: npx playwright test --project="${{ matrix.project }}" --workers=1
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
            ci-results/
          retention-days: 14

  # The same suite with the ten seeding commits reverted, which is what proves the seeded
  # defects are the reason the main run fails.
  clean-baseline:
    name: Clean baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Revert the seeded defects
        run: git revert --no-commit 6272c09^..115f747
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npm run seed
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run Playwright
        run: npx playwright test tests/e2e tests/api tests/smoke.spec.ts --project=chromium || true
      - name: Keep results
        if: always()
        run: |
          mkdir -p ci-results
          cp test-results/results.json ci-results/clean.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-clean-baseline
          path: ci-results/
          retention-days: 14

  a11y-and-visual:
    name: Accessibility and visual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npm run seed
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Accessibility suite
        run: npx playwright test tests/a11y --project=chromium

      # Visual baselines are platform-specific: Playwright names snapshots per OS, and
      # the committed set was generated on Windows. Rather than pretend otherwise, CI
      # generates its own Linux baselines on each run and asserts only that the two
      # screenshots taken in the same run agree. That catches a page failing to render
      # while staying honest about what a cross-platform baseline can prove.
      - name: Visual suite, Linux baselines
        run: |
          npx playwright test tests/visual --project=chromium --update-snapshots
          npx playwright test tests/visual --project=chromium

      - name: Upload Linux visual baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: tests/visual/**/*-linux.png
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a11y-visual
          path: |
            playwright-report/
            test-results/
          retention-days: 14
